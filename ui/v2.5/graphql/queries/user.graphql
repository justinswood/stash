query Me {
  me {
    ...UserData
  }
}

query FindUsers {
  findUsers {
    ...UserData
  }
}

query FindUser($id: ID!) {
  findUser(id: $id) {
    ...UserData
  }
}

query FindUserAPIKeys($user_id: ID) {
  findUserAPIKeys(user_id: $user_id) {
    ...UserAPIKeyData
  }
}

query AllCapabilities {
  allCapabilities
}

query FindUserCapabilities($id: ID!) {
  findUser(id: $id) {
    ...UserData
    ...UserCapabilityData
  }
}
