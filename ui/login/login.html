<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/%BASE_URL%/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login</title>

    <link rel="shortcut icon" href="data:,">
    <link rel="preload" href="/theme/fonts/Figtree-Variable.latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="login/login.css">
    <link rel="stylesheet" href="css">

    <!-- load locale -->
    <script>
        var localeStrings = {
            username: "Username",
            password: "Password",
            login: "Login",
            invalid_credentials: "Invalid credentials",
            internal_error: "Unexpected internal error. See logs for more details"
        };
    </script>
    <script src="login/locale"></script>
</head>

<script>
    function login() {
        var username = document.getElementById("username").value;
        var password = document.getElementById("password").value;
        var returnURL = document.getElementById("returnURL").value;

        var xhr = new XMLHttpRequest();
        xhr.open("POST", "login", true);
        xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
        xhr.onreadystatechange = function() {
            if (xhr.readyState == 4) {
                if (xhr.status == 200) {
                    window.location.replace(returnURL);
                } else {
                    document.getElementsByClassName("login-error")[0].innerHTML = localeStrings.invalid_credentials;
                }
            }
        };
        xhr.onerror = function() {
            document.getElementsByClassName("login-error")[0].innerHTML = localeStrings.internal_error;
        };
        var body = "username=" + encodeURIComponent(username) + "&password=" + encodeURIComponent(password) + "&returnURL=" + encodeURIComponent(returnURL);
        xhr.send(body);
    }
</script>

<body class="login">
    <div class="login-page">
        <section class="login-wall" aria-hidden="true">
            <div class="login-wall-grid">
                <div style="background: #3B2A5C"></div>
                <div class="drop" style="background: #1E3A4C"></div>
                <div style="background: #5A2E3A"></div>
                <div class="drop" style="background: #2B4A3A"></div>
                <div style="background: #4A3B22"></div>
                <div style="background: #24304F"></div>
                <div class="drop" style="background: #4C2550"></div>
                <div style="background: #1F3D3F"></div>
                <div class="drop" style="background: #3F2A2A"></div>
                <div style="background: #2E2A52"></div>
                <div style="background: #4A2E1F"></div>
                <div class="drop" style="background: #2A3F2A"></div>
                <div style="background: #3A2A4A"></div>
                <div class="drop" style="background: #1E2E4A"></div>
                <div style="background: #4F2A3F"></div>
            </div>
            <div class="login-wall-scrim"></div>
            <div class="login-wall-caption">
                <p class="login-eyebrow">Your library</p>
                <p class="login-tagline">Everything you collect, in one stash.</p>
            </div>
        </section>

        <main class="login-main">
            <div class="login-panel">
                <div class="login-brand">
                    <div class="login-brand-mark">
                        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"></path><path d="m3 13 9 5 9-5"></path><path d="m3 17.5 9 4.5 9-4.5"></path></svg>
                    </div>
                    <span class="login-brand-name">Stash</span>
                </div>

                <div class="login-heading">
                    <h1>Welcome back</h1>
                    <p>Sign in to pick up where you left off.</p>
                </div>

                <form action="login" method="POST" onsubmit="event.preventDefault(); login();">
                    <div class="form-group">
                        <label for="username" id="username-heading">Username</label>
                        <input class="text-input" id="username" name="username" type="text" autocomplete="username" placeholder="Username" />
                    </div>
                    <div class="form-group">
                        <label for="password" id="password-heading">Password</label>
                        <input class="text-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" />
                    </div>
                    <div class="login-error">{{.Error}}</div>

                    <input type="hidden" id="returnURL" name="returnURL" value="{{.URL}}" />

                    <input id="login-button" class="login-button" type="submit" value="Login">
                </form>

                <p class="login-footnote">Need an account? Ask your admin.</p>
            </div>
        </main>
    </div>

</body>

<script>
    document.getElementById("username-heading").innerText = localeStrings.username;
    document.getElementById("password-heading").innerText = localeStrings.password;
    document.getElementById("username").placeholder = localeStrings.username;
    document.getElementById("password").placeholder = localeStrings.password;
    document.getElementById("login-button").value = localeStrings.login;
</script>
</html>
