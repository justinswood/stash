"A local user account with its own login and role."
type User {
  id: ID!
  username: String!
  role: UserRole!
  disabled: Boolean!
  "Everything this account may actually do: the role preset plus grants, minus revokes."
  capabilities: [Capability!]!
  "Departures from the role preset. Empty for most accounts."
  capability_overrides: [UserCapabilityOverride!]!
  created_at: Time!
  updated_at: Time!
}

"""
A single permission. Roles are presets over these; an account's effective set is
its role preset plus per-user grants, minus per-user revokes.
"""
enum Capability {
  "Browse the library. Without it an account can log in and see nothing."
  VIEW_LIBRARY
  "Record one's own view and o history."
  OWN_HISTORY
  "Change one's own password."
  CHANGE_OWN_PASSWORD
  "Manage one's own saved filters and interface configuration, including the front page."
  OWN_VIEW_SETTINGS
  "Create and update library metadata."
  EDIT_METADATA
  "Run scrapers, which fetch external URLs on the server's behalf."
  SCRAPE
  "Create, update and revoke share links, which publish content publicly."
  MANAGE_SHARES
  "Issue and revoke one's own API keys."
  MANAGE_OWN_API_KEYS
  "Delete library objects and files."
  DELETE_CONTENT
  "Create, update and delete accounts, and read others' accounts and API keys."
  MANAGE_USERS
  "Change instance configuration."
  CONFIGURE
  "Run library tasks: scan, generate, identify, clean, import/export, migrate, backup."
  RUN_TASKS
  "Read operational state: logs, job queue, system and DLNA status."
  VIEW_SYSTEM
  "Enumerate paths on the host filesystem."
  BROWSE_FILESYSTEM
  "Install, enable and run plugins and packages."
  MANAGE_PLUGINS
  "Run arbitrary SQL against the database."
  EXECUTE_SQL
}

"A per-account departure from the role preset."
type UserCapabilityOverride {
  capability: Capability!
  "True adds a capability the role lacks; false removes one the role includes."
  granted: Boolean!
}

input UserCapabilityOverrideInput {
  capability: Capability!
  granted: Boolean!
}

input UserCapabilitiesSetInput {
  user_id: ID!
  "The complete override set. Any override omitted here is removed."
  overrides: [UserCapabilityOverrideInput!]!
}

enum UserRole {
  "Full control: settings, library tasks, user management, and deletes."
  ADMIN
  "Browse and edit metadata and manage own history. No settings/deletes/user-mgmt."
  USER
  "Browse and record own view history only."
  READ_ONLY
}

input UserCreateInput {
  username: String!
  password: String!
  role: UserRole!
  disabled: Boolean
}

input UserUpdateInput {
  id: ID!
  username: String
  "New password. Omit to leave the password unchanged."
  password: String
  role: UserRole
  disabled: Boolean
}

"""
A named, revocable API key belonging to a user account. Requests made with the
key act as that account and inherit its role, so disabling or deleting the owner
revokes the key. The key itself is stored only as a hash and is never returned
after creation.
"""
type UserAPIKey {
  id: ID!
  user_id: ID!
  name: String!
  "Leading characters of the key, so it can be identified in a list. Not secret."
  prefix: String!
  last_used_at: Time
  created_at: Time!
  updated_at: Time!
}

"Returned only when a key is created."
type UserAPIKeyCreated {
  api_key: UserAPIKey!
  "The plaintext key. Shown exactly once — it cannot be recovered afterwards."
  key: String!
}

input UserAPIKeyCreateInput {
  "The account to issue the key for. Defaults to the current user; another user requires admin."
  user_id: ID
  "A label to identify the key later."
  name: String!
}

input ChangePasswordInput {
  "The current password. Required when a user changes their own password."
  current_password: String
  new_password: String!
}
