"A local user account with its own login and role."
type User {
  id: ID!
  username: String!
  role: UserRole!
  disabled: Boolean!
  created_at: Time!
  updated_at: Time!
}

enum UserRole {
  "Full control: settings, library tasks, user management, and deletes."
  ADMIN
  "Browse and edit metadata and manage own history. No settings/deletes/user-mgmt."
  USER
  "Browse and record own view history only."
  READ_ONLY
}

input UserCreateInput {
  username: String!
  password: String!
  role: UserRole!
  disabled: Boolean
}

input UserUpdateInput {
  id: ID!
  username: String
  "New password. Omit to leave the password unchanged."
  password: String
  role: UserRole
  disabled: Boolean
}

"""
A named, revocable API key belonging to a user account. Requests made with the
key act as that account and inherit its role, so disabling or deleting the owner
revokes the key. The key itself is stored only as a hash and is never returned
after creation.
"""
type UserAPIKey {
  id: ID!
  user_id: ID!
  name: String!
  "Leading characters of the key, so it can be identified in a list. Not secret."
  prefix: String!
  last_used_at: Time
  created_at: Time!
  updated_at: Time!
}

"Returned only when a key is created."
type UserAPIKeyCreated {
  api_key: UserAPIKey!
  "The plaintext key. Shown exactly once — it cannot be recovered afterwards."
  key: String!
}

input UserAPIKeyCreateInput {
  "The account to issue the key for. Defaults to the current user; another user requires admin."
  user_id: ID
  "A label to identify the key later."
  name: String!
}

input ChangePasswordInput {
  "The current password. Required when a user changes their own password."
  current_password: String
  new_password: String!
}
